<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler RPG - Character Sheet</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(26, 30, 46, 0.85);
            --panel-border: #2a314d;
            --accent-color: #e04f5f;
            --accent-glow: rgba(224, 79, 95, 0.4);
            --mana-color: #3b82f6;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --input-bg: #121524;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(224, 79, 95, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(15, 17, 26, 0.85), rgba(15, 17, 26, 0.85)),
                url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920');
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 20px;
        }

        h2 {
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Profile Sidebar */
        .avatar-box {
            width: 100%;
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--panel-border);
            margin-bottom: 15px;
            position: relative;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .stat-value {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
        }

        .stat-value input {
            width: 50px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .modifier {
            display: inline-block;
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        /* Dynamic Health & Mana Bars */
        .resource-group {
            margin-bottom: 15px;
        }

        .resource-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .tracker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tracker-box {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .hp-box { background: rgba(224, 79, 95, 0.2); }
        .hp-box.filled { 
            background: var(--accent-color); 
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .mana-box { background: rgba(59, 130, 246, 0.2); }
        .mana-box.filled { 
            background: var(--mana-color); 
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.btn-reset { background: #475569; }

        /* Equipment Grid */
        .gear-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .gear-slot {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .gear-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid var(--panel-border);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Column: Character Profile -->
    <div class="sidebar">
        <div class="card">
            <h2>Crawler Profile</h2>
            <div class="avatar-box">
                <img id="avatar-img" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400" alt="Character Portrait">
            </div>
            <div class="form-group">
                <label>Avatar Image URL</label>
                <input type="text" id="avatar-url" onchange="updateAvatar()" placeholder="Paste image URL...">
            </div>
            <div class="form-group">
                <label>Character Name</label>
                <input type="text" id="char-name" value="Juggernaut Crawler">
            </div>
            <div class="form-group">
                <label>Race & Class</label>
                <input type="text" id="char-class" value="Human Brawler">
            </div>
            <div class="form-group">
                <label>Current Floor</label>
                <input type="number" id="char-floor" value="3">
            </div>
        </div>

        <div class="card">
            <h2>Quick Actions</h2>
            <div class="btn-group">
                <button onclick="saveData()">Save Character</button>
                <button class="btn-reset" onclick="resetData()">Reset</button>
            </div>
            <p id="save-status" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; text-align: center;"></p>
        </div>
    </div>

    <!-- Right Column: Stats, Resources, Gear -->
    <div class="main-content">
        <!-- Vitals & Trackers -->
        <div class="card">
            <h2>Vitals & Pool Trackers</h2>
            
            <div class="resource-group">
                <div class="resource-header">
                    <span>Health Capacity (<span id="hp-total-text">40</span> HP)</span>
                    <span id="hp-slot-count">10 / 10 Slots</span>
                </div>
                <div class="tracker-grid" id="hp-tracker"></div>
            </div>

            <div class="resource-group">
                <div class="resource-header">
                    <span>Mana Pool</span>
                    <span id="mana-slot-count">6 / 6 Mana</span>
                </div>
                <div class="tracker-grid" id="mana-tracker"></div>
            </div>
        </div>

        <!-- Attributes -->
        <div class="card">
            <h2>Core Attributes</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <label>STR</label>
                    <div class="stat-value">
                        <input type="number" id="stat-str" value="15" onchange="calculateSheet()">
                        <span class="modifier" id="mod-str">+4</span>
                    </div>
                </div>
                <div class="stat-card">
                    <label>CON</label>
                    <div class="stat-value">
                        <input type="number" id="stat-con" value="18" onchange="calculateSheet()">
                        <span class="modifier" id="mod-con">+4</span>
                    </div>
                </div>
                <div class="stat-card">
                    <label>DEX</label>
                    <div class="stat-value">
                        <input type="number" id="stat-dex" value="10" onchange="calculateSheet()">
                        <span class="modifier" id="mod-dex">+4</span>
                    </div>
                </div>
                <div class="stat-card">
                    <label>INT</label>
                    <div class="stat-value">
                        <input type="number" id="stat-int" value="6" onchange="calculateSheet()">
                        <span class="modifier" id="mod-int">+3</span>
                    </div>
                </div>
                <div class="stat-card">
                    <label>CHA</label>
                    <div class="stat-value">
                        <input type="number" id="stat-cha" value="4" onchange="calculateSheet()">
                        <span class="modifier" id="mod-cha">+2</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Combat & Gear -->
        <div class="card">
            <h2>Equipped Gear & Loadout</h2>
            <div class="gear-grid">
                <div class="gear-slot">
                    <img class="gear-icon" src="https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=100" alt="Chest">
                    <div style="width: 100%;">
                        <label>Torso</label>
                        <input type="text" id="gear-torso" value="Reinforced Plate (+3 DR)">
                    </div>
                </div>
                <div class="gear-slot">
                    <img class="gear-icon" src="https://images.unsplash.com/photo-1595590424283-b8f17842773f?q=80&w=100" alt="Weapon">
                    <div style="width: 100%;">
                        <label>Main Hand</label>
                        <input type="text" id="gear-main" value="Iron Warhammer (1d10 + STR)">
                    </div>
                </div>
                <div class="gear-slot">
                    <img class="gear-icon" src="https://images.unsplash.com/photo-1615672372407-432a76f2f293?q=80&w=100" alt="Shield">
                    <div style="width: 100%;">
                        <label>Off Hand</label>
                        <input type="text" id="gear-off" value="Tower Shield (+2 Evade)">
                    </div>
                </div>
                <div class="gear-slot">
                    <img class="gear-icon" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=100" alt="Boots">
                    <div style="width: 100%;">
                        <label>Feet</label>
                        <input type="text" id="gear-feet" value="Steel Boots (Ignore Rough Terrain)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Skills & Notes -->
        <div class="card">
            <h2>Skills, Passives & Notes</h2>
            <div class="form-group">
                <textarea id="char-notes" rows="4" placeholder="Enter skills, passives, and active debuffs...">- Pugilism (DEX): Unarmed proficiency + Iron Punch / Smush
- Warhammer (STR): Bludgeoning vs Heavy Armor
- Catcher (Passive): Intercept hits for adjacent allies
- Endurance (CON): Resist physical fatigue & environmental hazards</textarea>
            </div>
        </div>
    </div>
</div>

<script>
    // System Constants & State
    let hpCurrentSlots = 10;
    let maxHpSlots = 10;
    let manaCurrent = 6;
    let maxMana = 6;

    // Rules Formula: Modifier calculation lookup / math
    function getModifier(statValue) {
        return Math.floor(statValue / 4) + 1; // Example scale fitting the prompt stats
    }

    function calculateSheet() {
        const con = parseInt(document.getElementById('stat-con').value) || 0;
        const int = parseInt(document.getElementById('stat-int').value) || 0;
        const str = parseInt(document.getElementById('stat-str').value) || 0;
        const dex = parseInt(document.getElementById('stat-dex').value) || 0;
        const cha = parseInt(document.getElementById('stat-cha').value) || 0;

        // Update Modifiers
        const conMod = getModifier(con);
        document.getElementById('mod-con').innerText = '+' + conMod;
        document.getElementById('mod-str').innerText = '+' + getModifier(str);
        document.getElementById('mod-dex').innerText = '+' + getModifier(dex);
        document.getElementById('mod-int').innerText = '+' + getModifier(int);
        document.getElementById('mod-cha').innerText = '+' + getModifier(cha);

        // Calculate Derived Rules Math:
        // CON Mod * Slots = Total HP Capacity
        const totalHp = maxHpSlots * conMod;
        document.getElementById('hp-total-text').innerText = totalHp;
        
        // INT sets Max Mana
        maxMana = int;

        renderTrackers();
        saveDataSilently();
    }

    function renderTrackers() {
        // HP Tracker Rendering
        const hpContainer = document.getElementById('hp-tracker');
        hpContainer.innerHTML = '';
        for (let i = 0; i < maxHpSlots; i++) {
            const box = document.createElement('div');
            box.className = `tracker-box hp-box ${i < hpCurrentSlots ? 'filled' : ''}`;
            box.onclick = () => toggleHp(i);
            hpContainer.appendChild(box);
        }
        document.getElementById('hp-slot-count').innerText = `${hpCurrentSlots} / ${maxHpSlots} Slots`;

        // Mana Tracker Rendering
        const manaContainer = document.getElementById('mana-tracker');
        manaContainer.innerHTML = '';
        for (let i = 0; i < maxMana; i++) {
            const box = document.createElement('div');
            box.className = `tracker-box mana-box ${i < manaCurrent ? 'filled' : ''}`;
            box.onclick = () => toggleMana(i);
            manaContainer.appendChild(box);
        }
        document.getElementById('mana-slot-count').innerText = `${manaCurrent} / ${maxMana} Mana`;
    }

    function toggleHp(index) {
        hpCurrentSlots = (index + 1 === hpCurrentSlots) ? index : index + 1;
        renderTrackers();
        saveDataSilently();
    }

    function toggleMana(index) {
        manaCurrent = (index + 1 === manaCurrent) ? index : index + 1;
        renderTrackers();
        saveDataSilently();
    }

    function updateAvatar() {
        const url = document.getElementById('avatar-url').value;
        if (url) {
            document.getElementById('avatar-img').src = url;
        }
    }

    // LocalStorage Device Savings
    function saveData() {
        saveDataSilently();
        const status = document.getElementById('save-status');
        status.innerText = "Character Saved Locally!";
        setTimeout(() => status.innerText = "", 2000);
    }

    function saveDataSilently() {
        const data = {
            name: document.getElementById('char-name').value,
            class: document.getElementById('char-class').value,
            floor: document.getElementById('char-floor').value,
            avatar: document.getElementById('avatar-img').src,
            avatarUrl: document.getElementById('avatar-url').value,
            str: document.getElementById('stat-str').value,
            con: document.getElementById('stat-con').value,
            dex: document.getElementById('stat-dex').value,
            int: document.getElementById('stat-int').value,
            cha: document.getElementById('stat-cha').value,
            hpCurrent: hpCurrentSlots,
            manaCurrent: manaCurrent,
            torso: document.getElementById('gear-torso').value,
            main: document.getElementById('gear-main').value,
            off: document.getElementById('gear-off').value,
            feet: document.getElementById('gear-feet').value,
            notes: document.getElementById('char-notes').value
        };
        localStorage.setItem('crawler_char_data', JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem('crawler_char_data');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('char-name').value = data.name || '';
            document.getElementById('char-class').value = data.class || '';
            document.getElementById('char-floor').value = data.floor || '1';
            if (data.avatar) document.getElementById('avatar-img').src = data.avatar;
            document.getElementById('avatar-url').value = data.avatarUrl || '';
            
            document.getElementById('stat-str').value = data.str || 10;
            document.getElementById('stat-con').value = data.con || 10;
            document.getElementById('stat-dex').value = data.dex || 10;
            document.getElementById('stat-int').value = data.int || 10;
            document.getElementById('stat-cha').value = data.cha || 10;

            hpCurrentSlots = data.hpCurrent !== undefined ? data.hpCurrent : 10;
            manaCurrent = data.manaCurrent !== undefined ? data.manaCurrent : 6;

            document.getElementById('gear-torso').value = data.torso || '';
            document.getElementById('gear-main').value = data.main || '';
            document.getElementById('gear-off').value = data.off || '';
            document.getElementById('gear-feet').value = data.feet || '';
            document.getElementById('char-notes').value = data.notes || '';
        }
        calculateSheet();
    }

    function resetData() {
        if (confirm("Reset sheet back to default settings?")) {
            localStorage.removeItem('crawler_char_data');
            location.reload();
        }
    }

    // Initialize on load
    window.onload = loadData;
</script>
</body>
</html>
